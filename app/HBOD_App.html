<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="hbod-build" content="719420e076ca">
<title>HBOD · Training load, wellness and health monitor</title>
<link rel="icon" href="data:,">
<style data-source="app/src/app.css">
/*
 * HBOD application styles.
 *
 * Visual language of the rule-based prototype's dashboard, continued: navy, white cards, compact tables and the
 * fonts of the system. No font, image or stylesheet is loaded from anywhere.
 *
 * Colour never carries a meaning alone: every status is written out in a label. Navy belongs to what HBOD
 * computes (the probability and the daily list); red, amber and slate belong to the health gate, which the
 * athlete's own answers trigger. Acute load, chronic load and their ratio are drawn in neutral colours only.
 */
:root {
  --navy: #1f3864;
  --navy-dark: #172b4d;
  --navy-soft: #8ea3c9;
  --navy-tint: #e9eef6;
  --ink: #16181d;
  --ink-soft: #344054;
  --muted: #5b6472;
  --faint: #667085;
  --line: #e4e7ec;
  --line-strong: #d0d5dd;
  --page: #f4f6f8;
  --card: #ffffff;
  --head: #f2f4f7;
  --stop: #b42318;
  --stop-tint: #fef3f2;
  --stop-line: #f4c7c3;
  --refer: #9a6700;
  --refer-tint: #fff8e6;
  --refer-line: #ecd9a3;
  --hold: #475467;
  --hold-tint: #f2f4f7;
  --hold-line: #d0d5dd;
  --focus: #2f6fed;
  /* series colours of the charts, checked for colour-vision deficiencies as a set */
  --series-deficit: #2f5fa8;
  --series-fatigue: #d9591f;
  --series-fitness: #12936a;
  --series-strain: #6b4fbb;
  --series-neutral: #475467;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 14px/1.5 var(--sans);
}
h1, h2, h3, h4, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--navy); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }

.skip { position: absolute; left: -999px; top: 0; background: var(--navy); color: #fff; padding: 8px 12px; z-index: 20; }
.skip:focus { left: 8px; top: 8px; }

/* ------------------------------------------------------------------ header and tabs */
.appbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding: 12px 24px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark {
  flex: none;
  background: var(--navy);
  color: #fff;
  border-radius: 6px;
  padding: 5px 8px;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.06em;
}
.appbar h1 { font-size: 15px; font-weight: 600; }
.appmeta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.appmeta .private { color: var(--navy); font-weight: 600; }

.tabs {
  display: flex;
  gap: 2px;
  padding: 0 20px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  position: sticky;
  top: 0;
  z-index: 5;
}
.tab {
  flex: none;
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  padding: 10px 12px 8px;
  font-size: 13.5px;
  color: var(--muted);
  cursor: pointer;
}
.tab:hover { color: var(--navy); }
.tab[aria-current="page"] { color: var(--navy); font-weight: 600; border-bottom-color: var(--navy); }

#banners { max-width: 1440px; margin: 0 auto; padding: 0 24px; }
.banner {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 14px;
  padding: 9px 14px;
  border: 1px solid var(--line-strong);
  border-left: 4px solid var(--navy);
  border-radius: 6px;
  background: var(--card);
  font-size: 13px;
}
.banner b { color: var(--navy); }
.banner .spacer { flex: 1; }
.banner.notice { border-left-color: var(--hold); }
.errorbox {
  margin-top: 14px;
  padding: 10px 14px;
  border: 1px solid var(--stop-line);
  border-left: 4px solid var(--stop);
  border-radius: 6px;
  background: var(--stop-tint);
  color: #7a271a;
  font-size: 13px;
}
.errorbox p + p { margin-top: 4px; }

main {
  max-width: 1440px;
  margin: 0 auto;
  padding: 18px 24px 36px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
main:focus { outline: none; }
.appfoot {
  max-width: 1440px;
  margin: 0 auto;
  padding: 0 24px 28px;
  display: flex;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--faint);
}

/* ------------------------------------------------------------------ building blocks */
.box, .panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
}
.box { padding: 16px 18px; }
.panel { overflow-x: auto; }
.box > h2, .panel-head h2, .sect h2 { font-size: 14px; font-weight: 600; }
.box > h2 + .sub, .panel-head .sub { margin-top: 2px; }
.sub { font-size: 12.5px; color: var(--muted); }
.small { font-size: 12.5px; }
.muted { color: var(--muted); }
.panel-head { padding: 12px 16px 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.num { font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid3 { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 16px; }
.grid-side { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.prose { max-width: 78ch; }
.prose p + p { margin-top: 10px; }

.wording {
  border-left: 3px solid var(--navy);
  padding: 2px 0 2px 12px;
  font-size: 13.5px;
  color: var(--ink-soft);
  max-width: 110ch;
}
.wording strong { color: var(--ink); font-weight: 600; }

.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.toolbar .spacer { flex: 1; }
.field { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); }
.field-col { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-soft); }
.field-col > span { font-weight: 600; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--navy);
  color: #fff;
  border: 1px solid var(--navy);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
}
.btn:hover { background: var(--navy-dark); }
.btn.ghost { background: var(--card); color: var(--ink-soft); border-color: var(--line-strong); font-weight: 500; }
.btn.ghost:hover { background: var(--head); }
.btn.danger { background: var(--card); color: var(--stop); border-color: var(--stop-line); font-weight: 500; }
.btn.danger:hover { background: var(--stop-tint); }
.btn.tiny { padding: 3px 8px; font-size: 12.5px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.linkish { background: none; border: 0; padding: 0; color: var(--navy); font-weight: 600; cursor: pointer; text-align: left; }
.linkish:hover { text-decoration: underline; }

select, input[type="date"], input[type="text"], input[type="number"], textarea {
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  padding: 6px 9px;
  background: var(--card);
  font-size: 13px;
}
textarea { width: 100%; resize: vertical; line-height: 1.45; }
textarea.code { font: 12px/1.5 var(--mono); background: #fbfcfd; }
input[type="number"] { width: 5.5em; }
input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--navy); }

/* ------------------------------------------------------------------ tables */
table { border-collapse: collapse; width: 100%; font-size: 13px; }
thead th {
  background: var(--head);
  color: #475467;
  text-align: left;
  font-weight: 600;
  padding: 8px 12px;
  white-space: nowrap;
  vertical-align: bottom;
}
tbody td, tbody th { padding: 7px 12px; border-top: 1px solid #eef0f3; text-align: left; vertical-align: middle; font-weight: 400; }
th.r, td.r { text-align: right; }
tbody tr:hover { background: #fafbfc; }
thead .group th { padding-bottom: 2px; }
th.planning, td.planning { background: #fafafa; color: var(--muted); }
thead th.planning { background: #ecedf0; color: #475467; }
thead th.planning-group { background: #ecedf0; color: #475467; font-weight: 600; border-left: 1px solid var(--line-strong); }
th.planning-first, td.planning-first { border-left: 1px solid var(--line-strong); }
td.empty { padding: 18px 12px; color: var(--muted); }
table.plain thead th { background: none; border-bottom: 1px solid var(--line); padding-left: 0; }
table.plain tbody td, table.plain tbody th { padding-left: 0; }
table.plain tbody tr:hover { background: none; }

/* ------------------------------------------------------------------ probability bar: 0 to 1 with the 0.80 mark */
.prob { display: inline-flex; align-items: center; gap: 9px; white-space: nowrap; }
.pbar {
  position: relative;
  display: inline-block;
  width: 120px;
  height: 10px;
  background: var(--navy-tint);
  border-radius: 2px;
}
.pbar.wide { width: 100%; height: 14px; }
.pbar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--navy-soft); border-radius: 2px 0 0 2px; }
.pbar-fill.at { background: var(--navy); }
.pbar-mark { position: absolute; left: 80%; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.pval { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 2.4em; }
.pval.none { font-weight: 400; color: var(--muted); }
.part { display: grid; grid-template-columns: 9.5em 1fr 2.6em; align-items: center; gap: 10px; font-size: 13px; }
.part .pbar { width: 100%; height: 8px; }
.part .pbar-fill.deficit { background: var(--series-deficit); }
.part .pbar-fill.strain { background: var(--series-strain); }

/* ------------------------------------------------------------------ status and health-gate labels */
.chip {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 10px;
  border: 1px solid transparent;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.5;
  white-space: nowrap;
}
.chip.listed { background: var(--navy); color: #fff; border-color: var(--navy); }
.chip.above-outside-budget { background: var(--card); color: var(--navy); border-color: var(--navy); }
.chip.below-threshold { background: var(--head); color: var(--ink-soft); font-weight: 500; }
.chip.baseline-building { background: var(--card); color: #475467; border: 1px dashed #98a2b3; font-weight: 500; }
.chip.unavailable {
  color: #475467;
  font-weight: 500;
  border-color: var(--line-strong);
  background: repeating-linear-gradient(135deg, #f2f4f7 0 5px, #ffffff 5px 10px);
}
.gate { display: inline-block; min-width: 4.2em; text-align: center; padding: 1px 8px; border-radius: 4px; color: #fff; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
.gate.STOP { background: var(--stop); }
.gate.REFER { background: var(--refer); }
.gate.HOLD { background: var(--hold); }
.gate.none { background: none; color: var(--faint); font-weight: 400; letter-spacing: 0; text-align: left; padding-left: 0; min-width: 0; }

/* ------------------------------------------------------------------ squad view */
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 11px 14px 12px; }
.tile .k { font-size: 12.5px; color: var(--muted); }
.tile .v { font-size: 24px; font-weight: 600; line-height: 1.25; }
.tile .v small { font-size: 13px; font-weight: 400; color: var(--muted); }
.tile .d { font-size: 12.5px; color: var(--muted); }
.tile.primary { border-top: 3px solid var(--navy); padding-top: 9px; }

.gate-row, .list-row {
  display: grid;
  gap: 4px 12px;
  align-items: baseline;
  padding: 9px 16px;
  border-top: 1px solid #eef0f3;
}
.gate-row { grid-template-columns: 4.8em minmax(7em, 10em) 1fr; }
.gate-row .what { font-size: 13px; color: var(--ink-soft); }
.gate-row .why { grid-column: 3; font-size: 12.5px; color: var(--muted); }
.list-row { grid-template-columns: 1.6em minmax(7em, 10em) auto 1fr; align-items: center; }
.list-row .rank { font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }
.list-row .detail { font-size: 12.5px; color: var(--muted); }
.panel .rowtext { padding: 10px 16px 12px; border-top: 1px solid #eef0f3; font-size: 13px; color: var(--ink-soft); }
.panel .rowtext.first { border-top: 0; padding-top: 0; }

/* ------------------------------------------------------------------ athlete view */
.athlete-name { font-size: 20px; font-weight: 700; }
.bigp { display: flex; align-items: baseline; gap: 10px; margin-top: 10px; }
.bigp .v { font-size: 40px; font-weight: 700; line-height: 1; color: var(--navy); font-variant-numeric: tabular-nums; }
.bigp .v.none { font-size: 18px; font-weight: 600; color: var(--muted); }
.bigp .k { font-size: 13px; color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 14px; margin-top: 14px; }
.facts .k { font-size: 12px; color: var(--muted); }
.facts .v { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.facts .v small { font-size: 12px; font-weight: 400; color: var(--muted); }
.notes { margin: 12px 0 0; padding: 0 0 0 18px; font-size: 13px; color: var(--ink-soft); }
.notes li + li { margin-top: 3px; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 5px 0; border-top: 1px solid #eef0f3; }
.kv:first-of-type { border-top: 0; }
.kv span { color: var(--ink-soft); }
.kv b { font-weight: 600; text-align: right; }
.gatebox { margin-top: 10px; border: 1px solid; border-radius: 6px; padding: 9px 12px; font-size: 13px; }
.gatebox.STOP { background: var(--stop-tint); border-color: var(--stop-line); color: #7a271a; }
.gatebox.REFER { background: var(--refer-tint); border-color: var(--refer-line); color: #5c3d00; }
.gatebox.HOLD { background: var(--hold-tint); border-color: var(--hold-line); color: var(--ink-soft); }
.hrow { display: grid; grid-template-columns: 5.5em 1fr 1.6em; gap: 10px; align-items: center; margin-top: 9px; font-size: 13px; }
.hbar { height: 8px; background: var(--head); border-radius: 2px; overflow: hidden; }
.hbar div { height: 8px; background: var(--navy-soft); }

.chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.chart-head h2, .chart-head h3 { font-size: 14px; font-weight: 600; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; }
.key { display: inline-flex; align-items: center; gap: 6px; }
.key i { display: inline-block; width: 18px; height: 0; border-top: 2.5px solid var(--navy); }
.key i.dash { border-top-style: dashed; }
.key i.dot { width: 9px; height: 9px; border: 0; border-radius: 50%; background: var(--navy); }
.key i.ring { width: 9px; height: 9px; border: 2px solid var(--navy); border-radius: 50%; background: #fff; }
.key i.bar { width: 10px; height: 10px; border: 0; background: var(--navy); border-radius: 1px; }
.key i.hatch { width: 10px; height: 10px; border: 0; border-radius: 1px; background: repeating-linear-gradient(135deg, var(--navy-soft) 0 2px, #e9eef6 2px 4px); }
.key i.band { width: 14px; height: 10px; border: 0; background: #e7eaef; }
.chart { position: relative; margin-top: 8px; min-height: 60px; }
.chart svg { display: block; width: 100%; }
.chart text { font: 11px var(--sans); fill: var(--muted); }
.chart .tip {
  position: absolute;
  top: 6px;
  z-index: 2;
  pointer-events: none;
  background: var(--card);
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  box-shadow: 0 2px 8px rgba(16, 24, 40, 0.12);
  padding: 7px 10px;
  font-size: 12.5px;
  line-height: 1.45;
  white-space: nowrap;
}
.chart .tip b { font-weight: 600; }
.chart .tip .key i { width: 12px; }
.planning-panel { background: #fafafa; border: 1px dashed #b9c0cb; border-radius: 8px; padding: 14px 18px 16px; }
.planning-panel > h2 { font-size: 14px; font-weight: 600; }
.planning-panel .box { background: var(--card); }
details.values > summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--navy); padding: 4px 0; }
details.values .panel { margin-top: 10px; }

/* ------------------------------------------------------------------ first screen */
.loader { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.drop {
  border: 2px dashed #98a2b3;
  border-radius: 8px;
  padding: 22px 18px;
  margin-top: 12px;
  text-align: center;
  background: #fbfcfd;
  color: var(--ink-soft);
}
.drop.over { border-color: var(--navy); background: var(--navy-tint); }
.drop p { margin-bottom: 10px; }
.or { margin: 14px 0 0; font-size: 13px; color: var(--muted); }
.columns-table td:first-child, .columns-table th:first-child { white-space: nowrap; font-weight: 600; }

/* ------------------------------------------------------------------ report, summary, settings */
.report-frame { width: 100%; height: 70vh; border: 1px solid var(--line); border-radius: 8px; background: #fff; display: block; }
.report-text { white-space: pre-wrap; font: 12.5px/1.5 var(--mono); }
.check { margin-top: 10px; padding: 9px 12px; border-radius: 6px; border: 1px solid var(--line-strong); font-size: 13px; background: #fbfcfd; }
.check.issues { border-color: var(--refer-line); background: var(--refer-tint); color: #5c3d00; }
.check ul { margin: 4px 0 0; padding-left: 18px; }
.formgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) auto; gap: 12px; align-items: end; margin-top: 12px; }
.formgrid select, .formgrid input { width: 100%; }
.settings-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 12px; }
.cut { max-width: 46ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ------------------------------------------------------------------ narrower screens and print */
@media (max-width: 1100px) {
  .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid2, .grid3, .grid-side, .loader { grid-template-columns: minmax(0, 1fr); }
  .formgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 700px) {
  .appbar, main, #banners, .appfoot { padding-left: 14px; padding-right: 14px; }
  .tabs { padding: 0 8px; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .gate-row { grid-template-columns: 4.8em 1fr; }
  .gate-row .what, .gate-row .why { grid-column: 1 / -1; }
  .list-row { grid-template-columns: 1.6em 1fr; }
  .list-row .prob, .list-row .detail { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .tab { transition: background-color 0.12s, color 0.12s; }
}
@media print {
  body { background: #fff; }
  .tabs, .toolbar, .banner, .skip, .appfoot, .btn { display: none !important; }
  .appbar { border: 0; padding: 0 0 8px; }
  main { padding: 0; max-width: none; }
  .box, .panel, .tile { break-inside: avoid; }
}
</style>
</head>
<body>
<a class="skip" href="#view">Skip to the content</a>

<header class="appbar">
  <div class="brand">
    <span class="mark" aria-hidden="true">HBOD</span>
    <h1>HBOD · Training load, wellness and health monitor</h1>
  </div>
  <div class="appmeta">
    <span id="data-through">No data loaded</span>
    <span class="private">Computed on this device · no data uploaded</span>
  </div>
</header>

<nav class="tabs" id="tabs" aria-label="Sections">
  <button type="button" class="tab" data-tab="squad">Squad</button>
  <button type="button" class="tab" data-tab="athlete">Athlete</button>
  <button type="button" class="tab" data-tab="report">Daily report</button>
  <button type="button" class="tab" data-tab="availability">Availability</button>
  <button type="button" class="tab" data-tab="summary">Language summary</button>
  <button type="button" class="tab" data-tab="audit">Audit log</button>
  <button type="button" class="tab" data-tab="settings">Settings</button>
  <button type="button" class="tab" data-tab="about">About</button>
</nav>

<div id="banners"></div>
<main id="view" tabindex="-1">
  <noscript>
    <p class="box">HBOD computes in this page and needs JavaScript. Nothing is sent anywhere: all computation runs
    on this device.</p>
  </noscript>
</main>

<footer class="appfoot">
  <span id="foot-wording"></span>
  <span id="foot-version"></span>
</footer>

<script>
/*
 * Start-up guard. Any script error is shown on the page in an element with the identifier "hbod-error", so that
 * a failure is never silent and an automated check can detect it.
 */
(function () {
  'use strict';
  var ERROR_ID = 'hbod-error';
  window.hbodShowError = function (message) {
    var box = document.getElementById(ERROR_ID);
    if (!box) {
      box = document.createElement('div');
      box.id = ERROR_ID;
      box.className = 'errorbox';
      box.setAttribute('role', 'alert');
      var host = document.getElementById('banners') || document.body;
      host.insertBefore(box, host.firstChild);
    }
    var line = document.createElement('p');
    line.textContent = String(message);
    box.appendChild(line);
  };
  window.addEventListener('error', function (event) {
    window.hbodShowError('HBOD stopped on an error: ' + (event.message || 'unknown error') +
      (event.lineno ? ' (line ' + event.lineno + ')' : ''));
  });
  window.addEventListener('unhandledrejection', function (event) {
    var reason = event.reason;
    window.hbodShowError('HBOD stopped on an error: ' + (reason && reason.message ? reason.message : String(reason)));
  });
})();
</script>
<script data-source="app/src/engine.js">
/*
 * HBOD state-space engine (JavaScript).
 *
 * Port of the HBOD engine of Supplementary File S1 (simulation/sim/engines.py: EngineBank._impute and
 * EngineBank._kalman with use_obs=True, the class named v2 in that file). The equations are Equations 7 to 14
 * of Section 2.5 of the paper and the settings are those of Table S2. Every arithmetic step keeps the order of
 * operations of the Python code so that the two implementations can be compared number by number
 * (see parity/).
 *
 * Three states per athlete: fitness G and fatigue H (exponentially weighted means of daily load, in kAU) and a
 * wellness strain s that load does not explain (Hooper item units). The daily output is the posterior probability
 * that the fatigue-minus-fitness deficit or the strain exceeds the athlete's own baseline by kappa SD. It describes
 * the state of the athlete relative to that baseline. It is not the probability of an injury or an illness.
 *
 * The acute-to-chronic workload ratio is not computed here and triggers nothing.
 *
 * Pure computation: no DOM, no network, no storage. Runs unchanged in the browser and in Node.js.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.HBODEngine = factory();
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const VERSION = '1.0.0';

  // ------------------------------------------------------------------ settings (Table S2)
  const SETTINGS = Object.freeze({
    tauG: 42.0,                 // fitness time constant (days): F[0][0] = exp(-1/42)
    tauH: 7.0,                  // fatigue time constant (days): F[1][1] = exp(-1/7)
    rhoS: 0.80,                 // autoregressive coefficient of the wellness strain: F[2][2]
    qG: 0.005,                  // process-noise SD of fitness (kAU)
    qH: 0.03,                   // process-noise SD of fatigue (kAU)
    qS: 0.30,                   // process-noise SD of strain (Hooper item units)
    p0G: 0.05,                  // initial variance of fitness
    p0H: 0.05,                  // initial variance of fatigue; strain starts at qS^2 / (1 - rhoS^2) = 0.25
    theta0: Object.freeze([3.5, 1.0, 0.3]),   // initial observation coefficients (c0, ch, cg)
    rlsP0: Object.freeze([1.0, 4.0, 4.0]),    // initial diagonal of the recursive-least-squares covariance
    forget: 0.99,               // forgetting factor of recursive least squares
    chMin: 0.1, chMax: 5.0,     // bounds of ch
    cgMin: 0.0, cgMax: 5.0,     // bounds of cg
    R0: 0.5,                    // initial observation variance
    rKeep: 0.95, rGain: 0.05,   // adaptive observation variance: R <- max(0.95 R + 0.05 (e^2 - c P c'), rFloor)
    rFloor: 0.05,
    correctionStartDay: 14,     // wellness correction from day 14 (days are numbered from 0)
    baselineStartDay: 28,       // personal baseline and probability from day 28
    baselineWindow: 42,         // up to 42 previous days
    kappa: 1.0,                 // exceedance of the baseline, in SD
    alertProbability: 0.80,     // alert when the posterior probability reaches 0.80
    imputeInflation: 4.0,       // process-noise variances of fitness and fatigue x 4 on days with an imputed load
    auPerKau: 1000.0,           // load enters the filter in thousands of arbitrary units
    varFloor: 1e-10,            // floor of the posterior variances inside the probability
    pClip: 1e-12,               // probabilities are kept inside [1e-12, 1 - 1e-12]
    alertBudget: 0.10           // default alert rate: share of healthy athlete-days on the daily list
  });

  // ------------------------------------------------------------------ standard normal distribution function
  // Cephes ndtr (erf and erfc by rational approximation), the routine behind scipy.stats.norm.cdf in File S1.
  const P_ = [2.46196981473530512524e-10, 5.64189564831068821977e-1, 7.46321056442269912687e0,
    4.86371970985681366614e1, 1.96520832956077098242e2, 5.26445194995477358631e2,
    9.34528527171957607540e2, 1.02755188689515710272e3, 5.57535335369399327526e2];
  const Q_ = [1.32281951154744992508e1, 8.67072140885989742329e1, 3.54937778887819891062e2,
    9.75708501743205489753e2, 1.82390916687909736289e3, 2.24633760818710981792e3,
    1.65666309194161350182e3, 5.57535340817727675546e2];
  const R_ = [5.64189583547755073984e-1, 1.27536670759978104416e0, 5.01905042251180477414e0,
    6.16021097993053585195e0, 7.40974269950448939160e0, 2.97886665372100240670e0];
  const S_ = [2.26052863220117276590e0, 9.39603524938001434673e0, 1.20489539808096656605e1,
    1.70814450747565897222e1, 9.60896809063285878198e0, 3.36907645100081516050e0];
  const T_ = [9.60497373987051638749e0, 9.00260197203842689217e1, 2.23200534594684319226e3,
    7.00332514112805075473e3, 5.55923013010394962768e4];
  const U_ = [3.35617141647503099647e1, 5.21357949780152679795e2, 4.59432382970980127987e3,
    2.26290000613890934246e4, 4.92673942608635921086e4];
  const MAXLOG = 7.09782712893383996843e2;

  function polevl(x, c) {
    let a = c[0];
    for (let i = 1; i < c.length; i++) a = a * x + c[i];
    return a;
  }
  function p1evl(x, c) {
    let a = x + c[0];
    for (let i = 1; i < c.length; i++) a = a * x + c[i];
    return a;
  }
  function erf(x) {
    if (Number.isNaN(x)) return NaN;
    if (x < 0.0) return -erf(-x);
    if (Math.abs(x) > 1.0) return 1.0 - erfc(x);
    const z = x * x;
    return x * polevl(z, T_) / p1evl(z, U_);
  }
  function erfc(a) {
    if (Number.isNaN(a)) return NaN;
    const x = a < 0.0 ? -a : a;
    if (x < 1.0) return 1.0 - erf(a);
    let z = -a * a;
    if (z < -MAXLOG) return a < 0 ? 2.0 : 0.0;
    z = Math.exp(z);
    let p, q;
    if (x < 8.0) { p = polevl(x, P_); q = p1evl(x, Q_); }
    else { p = polevl(x, R_); q = p1evl(x, S_); }
    let y = (z * p) / q;
    if (a < 0) y = 2.0 - y;
    if (y === 0.0) return a < 0 ? 2.0 : 0.0;
    return y;
  }
  function normCdf(a) {
    if (Number.isNaN(a)) return NaN;
    const x = a * Math.SQRT1_2;
    const z = Math.abs(x);
    if (z < Math.SQRT1_2) return 0.5 + 0.5 * erf(x);
    let y = 0.5 * erfc(z);
    if (x > 0) y = 1.0 - y;
    return y;
  }

  // ------------------------------------------------------------------ helpers
  // Sum in the order used by NumPy for a contiguous run of doubles (pairwise summation with eight
  // accumulators), so that baseline means and SDs follow File S1 to the last bit.
  function pairwiseSum(a, start, n) {
    if (n < 8) {
      let res = 0.0;
      for (let i = 0; i < n; i++) res += a[start + i];
      return res;
    }
    if (n <= 128) {
      const r = [a[start], a[start + 1], a[start + 2], a[start + 3],
        a[start + 4], a[start + 5], a[start + 6], a[start + 7]];
      let i = 8;
      const lim = n - (n % 8);
      for (; i < lim; i += 8) {
        r[0] += a[start + i]; r[1] += a[start + i + 1]; r[2] += a[start + i + 2]; r[3] += a[start + i + 3];
        r[4] += a[start + i + 4]; r[5] += a[start + i + 5]; r[6] += a[start + i + 6]; r[7] += a[start + i + 7];
      }
      let res = ((r[0] + r[1]) + (r[2] + r[3])) + ((r[4] + r[5]) + (r[6] + r[7]));
      for (; i < n; i++) res += a[start + i];
      return res;
    }
    let n2 = Math.floor(n / 2);
    n2 -= n2 % 8;
    return pairwiseSum(a, start, n2) + pairwiseSum(a, start + n2, n - n2);
  }

  // Mean and population SD of a[start .. start+n-1].
  function meanStd(a, start, n) {
    const mean = (0.0 + pairwiseSum(a, start, n)) / n;
    const sq = new Array(n);
    for (let k = 0; k < n; k++) { const v = a[start + k] - mean; sq[k] = v * v; }
    return [mean, Math.sqrt((0.0 + pairwiseSum(sq, 0, n)) / n)];
  }

  // Median as NumPy computes it: middle value, or half the sum of the two middle values.
  function median(values) {
    const v = values.slice().sort(function (p, q) { return p - q; });
    const n = v.length, h = n >> 1;
    return n % 2 ? v[h] : (v[h - 1] + v[h]) / 2.0;
  }

  function isMissing(v) { return v === null || v === undefined || Number.isNaN(v); }

  function resolveSettings(overrides) {
    const s = {};
    for (const k of Object.keys(SETTINGS)) s[k] = SETTINGS[k];
    if (overrides) for (const k of Object.keys(overrides)) s[k] = overrides[k];
    return Object.freeze(s);
  }

  // Alert threshold on the logit scale. File S1 writes it as log(0.8 / 0.2).
  function alertLogit(pAlert) {
    return pAlert === 0.8 ? Math.log(0.8 / 0.2) : Math.log(pAlert / (1 - pAlert));
  }

  // ------------------------------------------------------------------ the squad filter
  /**
   * createSquad(ids, overrides) -> squad
   *   ids        athlete identifiers (strings), in a fixed order; one squad shares one daily median
   *   overrides  optional replacements of SETTINGS (used by tests only; the application runs the defaults)
   *
   * squad.step(day) processes the next calendar day (days are numbered from 0) and returns the day's results.
   *   day.load[i]         reported session load of athlete i in AU (sum of duration x RPE over the day's sessions,
   *                       0 for a reported rest day); NaN, null or undefined when no session load was reported
   *   day.hooper[i]       the four Hooper items [a, b, c, d], each 1 (best) to 7 (worst), or null when the athlete
   *                       did not give all four
   *   day.unavailable[i]  true when the athlete is injured, ill or in return to play (contributes zero load)
   */
  function createSquad(ids, overrides) {
    const S = resolveSettings(overrides);
    const N = ids.length;
    const ag = Math.exp(-1 / S.tauG), ah = Math.exp(-1 / S.tauH), rs = S.rhoS;
    const f = [ag, ah, rs];
    const b = [1 - ag, 1 - ah, 0.0];
    const q = [S.qG * S.qG, S.qH * S.qH, S.qS * S.qS];
    const thr = alertLogit(S.alertProbability);
    const lam = S.forget;
    const ath = [];
    for (let i = 0; i < N; i++) {
      ath.push({
        id: ids[i],
        x: [0.0, 0.0, 0.0],
        P: [[S.p0G, 0.0, 0.0], [0.0, S.p0H, 0.0], [0.0, 0.0, q[2] / (1 - rs * rs)]],
        theta: [S.theta0[0], S.theta0[1], S.theta0[2]],
        Pr: [[S.rlsP0[0], 0.0, 0.0], [0.0, S.rlsP0[1], 0.0], [0.0, 0.0, S.rlsP0[2]]],
        R: S.R0,
        dd: [],   // history of the deficit d = H - G
        ss: []    // history of the strain s
      });
    }
    let t = 0;

    function step(day) {
      // ---- imputation (EngineBank._impute): squad median of the day among available reporters
      const reporters = [];
      for (let i = 0; i < N; i++) {
        if (!day.unavailable[i] && !isMissing(day.load[i])) reporters.push(Number(day.load[i]));
      }
      const med = reporters.length ? median(reporters) : 0.0;
      const out = { t: t, squadMedian: med, reporters: reporters.length, athletes: new Array(N) };

      for (let i = 0; i < N; i++) {
        const a = ath[i];
        const unavailable = !!day.unavailable[i];
        const reported = !isMissing(day.load[i]);
        const u = unavailable ? 0.0 : (reported ? Number(day.load[i]) : med);
        const imputed = !reported && !unavailable;
        const ukau = u / S.auPerKau;
        const hoop = day.hooper ? day.hooper[i] : null;
        let have = false, y = NaN;
        if (hoop && hoop.length === 4 && !isMissing(hoop[0]) && !isMissing(hoop[1]) &&
            !isMissing(hoop[2]) && !isMissing(hoop[3])) {
          have = true;
          y = (((Number(hoop[0]) + Number(hoop[1])) + Number(hoop[2])) + Number(hoop[3])) / 4.0;
        }

        // ---- time update with today's reported or imputed load (Equation 7)
        let x0 = a.x[0] * f[0] + ukau * b[0];
        let x1 = a.x[1] * f[1] + ukau * b[1];
        let x2 = a.x[2] * f[2] + ukau * b[2];
        const P = a.P;
        for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) P[r][c] = (f[r] * P[r][c]) * f[c];
        const infl = imputed ? S.imputeInflation : 1.0;
        P[0][0] += q[0] * infl; P[1][1] += q[1] * infl; P[2][2] += q[2];

        let corrected = false;
        if (have) {
          const th = a.theta;
          // regressors of recursive least squares use the predicted load states; target net of predicted strain
          const phi = [1.0, x1, -x0];
          const yRls = y - x2;
          if (t >= S.correctionStartDay) {
            // ---- wellness correction (Equations 8 to 11)
            const H = [-th[2], th[1], 1.0];
            const yhat = th[0] + ((H[0] * x0 + H[1] * x1) + H[2] * x2);
            const e = y - yhat;
            const HP = [0, 0, 0];
            for (let c = 0; c < 3; c++) HP[c] = (H[0] * P[0][c] + H[1] * P[1][c]) + H[2] * P[2][c];
            const hph = (HP[0] * H[0] + HP[1] * H[1]) + HP[2] * H[2];
            const Sv = hph + a.R;
            const K = [HP[0] / Sv, HP[1] / Sv, HP[2] / Sv];
            x0 = x0 + K[0] * e; x1 = x1 + K[1] * e; x2 = x2 + K[2] * e;
            for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) P[r][c] = P[r][c] - K[r] * HP[c];
            a.R = Math.max(S.rKeep * a.R + S.rGain * (e * e - hph), S.rFloor);
            corrected = true;
          }
          // ---- recursive least squares with forgetting (Equations 12 and 13)
          const Pr = a.Pr;
          const Pphi = [0, 0, 0];
          for (let r = 0; r < 3; r++) Pphi[r] = (Pr[r][0] * phi[0] + Pr[r][1] * phi[1]) + Pr[r][2] * phi[2];
          const den = lam + ((phi[0] * Pphi[0] + phi[1] * Pphi[1]) + phi[2] * Pphi[2]);
          const Kr = [Pphi[0] / den, Pphi[1] / den, Pphi[2] / den];
          const er = yRls - ((th[0] * phi[0] + th[1] * phi[1]) + th[2] * phi[2]);
          const t0 = th[0] + Kr[0] * er;
          let t1 = th[1] + Kr[1] * er;
          let t2 = th[2] + Kr[2] * er;
          for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) Pr[r][c] = (Pr[r][c] - Kr[r] * Pphi[c]) / lam;
          t1 = Math.min(Math.max(t1, S.chMin), S.chMax);
          t2 = Math.min(Math.max(t2, S.cgMin), S.cgMax);
          a.theta = [t0, t1, t2];
        }
        a.x = [x0, x1, x2];

        // ---- posterior exceedance probability (Equation 14)
        const d = x1 - x0;
        const vd = P[0][0] + P[1][1] - 2 * P[0][1];
        const sdD = Math.sqrt(Math.max(vd, S.varFloor));
        const sdS = Math.sqrt(Math.max(P[2][2], S.varFloor));
        let p = null, logit = null, pD = null, pS = null, alert = false, base = null;
        if (t >= S.baselineStartDay) {
          const lo = Math.max(0, t - S.baselineWindow), n = t - lo;
          const md = meanStd(a.dd, lo, n), ms = meanStd(a.ss, lo, n);
          pD = normCdf((d - md[0] - S.kappa * md[1]) / sdD);
          pS = normCdf((x2 - ms[0] - S.kappa * ms[1]) / sdS);
          p = 1 - (1 - pD) * (1 - pS);
          p = Math.min(Math.max(p, S.pClip), 1 - S.pClip);
          logit = Math.log(p / (1 - p));
          // File S1 stores the score in single precision before comparing it with the threshold
          alert = Math.fround(logit) >= thr;
          base = { days: n, meanDeficit: md[0], sdDeficit: md[1], meanStrain: ms[0], sdStrain: ms[1] };
        }
        a.dd.push(d); a.ss.push(x2);

        out.athletes[i] = {
          id: a.id, t: t,
          unavailable: unavailable, reported: reported, imputed: imputed,
          load: u,                       // load used by the filter (AU): reported, squad median or zero
          hooperMean: have ? y : null,
          corrected: corrected,          // wellness correction applied today
          fitness: x0, fatigue: x1, strain: x2, deficit: d,
          sdDeficit: sdD, sdStrain: sdS,
          pDeficit: pD, pStrain: pS,
          probability: p, logit: logit, alert: alert,
          baseline: base,
          coefficients: [a.theta[0], a.theta[1], a.theta[2]],
          observationVariance: a.R
        };
      }
      t += 1;
      return out;
    }

    return {
      ids: ids.slice(),
      settings: S,
      step: step,
      get day() { return t; }
    };
  }

  /** runSquad(ids, days, overrides) -> array of daily results, one per element of days. */
  function runSquad(ids, days, overrides) {
    const squad = createSquad(ids, overrides);
    const res = new Array(days.length);
    for (let k = 0; k < days.length; k++) res[k] = squad.step(days[k]);
    return res;
  }

  // ------------------------------------------------------------------ alert rate
  /** Largest daily list for a number of healthy athletes: budget x healthy, halves rounded down, at least one. */
  function dailyCap(nHealthy, budget) {
    if (!(nHealthy > 0)) return 0;
    return Math.max(1, Math.ceil(budget * nHealthy - 0.5));
  }

  /**
   * alertBudget(athletes, options) ranks the healthy athletes of one day by posterior probability and caps
   * the daily list.
   *   athletes         the athletes array returned by squad.step
   *   options.enabled  false lists every healthy athlete at or above the alert threshold (default true)
   *   options.budget   share of healthy athlete-days on the list (default SETTINGS.alertBudget = 0.10,
   *                    about two athletes per day in a squad of 25)
   * Returns { enabled, budget, healthy, cap, ranking, listed, overflow } where ranking, listed and overflow hold
   * athlete identifiers ordered by decreasing probability. Unavailable athletes are never listed.
   */
  function alertBudget(athletes, options) {
    const o = options || {};
    const enabled = o.enabled !== false;
    const budget = o.budget === undefined || o.budget === null ? SETTINGS.alertBudget : o.budget;
    const healthy = [];
    for (let i = 0; i < athletes.length; i++) if (!athletes[i].unavailable) healthy.push({ a: athletes[i], k: i });
    const scored = healthy.filter(function (h) { return h.a.probability !== null; });
    scored.sort(function (p, q) {
      return (q.a.probability - p.a.probability) || (q.a.logit - p.a.logit) || (p.k - q.k);
    });
    const above = scored.filter(function (h) { return h.a.alert; });
    const cap = enabled ? dailyCap(healthy.length, budget) : above.length;
    return {
      enabled: enabled,
      budget: budget,
      healthy: healthy.length,
      cap: cap,
      ranking: scored.map(function (h) { return h.a.id; }),
      listed: above.slice(0, cap).map(function (h) { return h.a.id; }),
      overflow: above.slice(cap).map(function (h) { return h.a.id; })
    };
  }

  return {
    VERSION: VERSION,
    SETTINGS: SETTINGS,
    createSquad: createSquad,
    runSquad: runSquad,
    alertBudget: alertBudget,
    dailyCap: dailyCap,
    normCdf: normCdf,
    _internal: { erf: erf, erfc: erfc, pairwiseSum: pairwiseSum, meanStd: meanStd, median: median, alertLogit: alertLogit }
  };
});
</script>
<script data-source="app/src/core.js">
/*
 * HBOD analytical core (JavaScript).
 *
 * Reads the form responses of one squad, prepares the daily inputs of the HBOD engine (engine.js), runs it over
 * every calendar day and assembles what the application, the daily report and the language-model layer show.
 *
 * The decision comes from the engine only: the posterior probability of Equation 14 and the alert rate. Acute
 * load, chronic load and their ratio are computed here for planning; nothing in this file reads them to decide,
 * rank, flag or word anything.
 *
 * Ingest (column matching, numbers, yes/no answers, dates, Oslo item scores) and the health module (daily health
 * item, weekly Oslo questionnaire, health gate) follow the Python core of the rule-based prototype function by
 * function, so that French and English form exports are read exactly as before. Where Python and JavaScript differ
 * in a detail (whitespace, digits of other scripts, rounding of halves), the Python behaviour is reproduced.
 *
 * Pure computation: no DOM, no network, no storage, no clock. Runs unchanged in the browser and in Node.js.
 * Dates are calendar days written 'YYYY-MM-DD'.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(require('./engine.js'));
  else root.HBODCore = factory(root.HBODEngine);
})(typeof globalThis !== 'undefined' ? globalThis : this, function (HBODEngine) {
  'use strict';

  // ------------------------------------------------------------------ fixed wording
  // Sentences shared by the application, the report and the prompt of the language-model layer.
  const WORDING = Object.freeze({
    probability: "HBOD reports the probability that the athlete's modelled state exceeds his or her own baseline. " +
      'It is not the probability of an injury or illness.',
    probabilityDetail: 'It is the probability that the fatigue-minus-fitness deficit or the wellness strain exceeds ' +
      "the athlete's own baseline of up to 42 previous days by one standard deviation. An alert is raised when it " +
      'reaches 0.80.',
    planning: 'Acute load, chronic load and their ratio are shown for planning only. They do not trigger any decision.',
    missing: 'A missing session load is replaced by the squad median of that day and the uncertainty of fitness and ' +
      'fatigue is multiplied by four. A missing day is never treated as rest.',
    budget: 'The alert rate ranks athletes by probability and caps the daily list at about 10% of healthy ' +
      'athlete-days, about two athletes per day in a squad of 25.',
    gate: 'The health gate sits above load and wellness: it holds, refers or stops an athlete with a declared ' +
      'problem, whatever the probability shows.',

      const athlete = strip(p && p.athlete !== undefined && p.athlete !== null ? p.athlete : '');
      if (!athlete) throw new Error('The ' + what + ' does not name an athlete.');
      const from = requireDate(p.from, 'start of ' + what);
      const open = p.to === null || p.to === undefined || p.to === '';
      const to = open ? null : requireDate(p.to, 'end of ' + what);
      if (to !== null && to < from) {
        throw new Error('The ' + what + ' ends before it starts (' + from + ' to ' + to + ').');
      }
      const reason = strip(p.reason === null || p.reason === undefined ? '' : p.reason) || 'unavailable';
      out.push({ athlete: athlete, from: from, to: to, reason: reason });
    });
    return out;
  }

  function resolveBudget(b) {
    const enabled = !b || b.enabled !== false;
    const share = b && b.share !== undefined && b.share !== null ? Number(b.share) : HBODEngine.SETTINGS.alertBudget;
    if (!(share > 0 && share <= 1)) {
      throw new RangeError('The alert rate must be a share above 0 and at most 1, for example 0.10.');
    }
    return { enabled: enabled, share: share };
  }

  // ------------------------------------------------------------------ analysis
  const MAX_DAYS = 3660;      // about ten years: a longer span points to a mistyped date

  /**
   * analyse(records, options?) -> analysis
   * Runs the HBOD engine over every calendar day of one squad. One file is one squad: all its athletes share the
   * daily median.
   *   options = {
   *     availability  [{ athlete, from, to, reason }]   log of periods during which an athlete is injured, ill or
   *                   in return to play. from and to are dates (both days included); to may be null for a period
   *                   that is still open. reason is free text, usually 'injured', 'ill' or 'return to play'.
   *                   Periods of athletes outside the roster are ignored.
   *     budget        { enabled: true, share: 0.10 }    alert rate; a share outside (0, 1] throws a RangeError
   *     endDate       last day to process (default: the last report). Later reports are left out.
   *     startDate     day 0 (default: the earliest report). Earlier reports are left out.
   *     roster        string[]   athletes to include even if they never reported
   *   }
   *   analysis = {
   *     engineVersion, settings         HBODEngine.VERSION and HBODEngine.SETTINGS (Table S2)
   *     budget                          { enabled, share }
   *     athletes                        string[]   every athlete named in the file or in the roster, sorted
   *     dates                           string[]   every calendar day from startDate to endDate
   *     startDate, endDate
   *     days                            the engine's result for each day (see engine.js), athletes in the order
   *                                     of analysis.athletes; days[t].athletes[i].id is the athlete's name
   *     lists                           per day, HBODEngine.alertBudget of that day:
   *                                     { enabled, budget, healthy, cap, ranking, listed, overflow } (names)
   *     inputs = {                      what the engine received, indexed [t][i]
   *       load                number | null    reported session load of the day in AU; null = not reported
   *       hooper              [sleep, stress, fatigue, soreness] | null    null unless all four were given
   *       unavailable         boolean
   *       unavailableReason   string | null    reason from the log, else from the availability column
   *       items               { fatigue, stress, soreness, sleep } | null  Hooper items as answered that day,
   *                           any may be null; null when the athlete answered none
   *       recordCount         number of form records of the athlete on that day
   *     }
   *     availability                    the log after checking: [{ athlete, from, to | null, reason }]
   *     skipped                         { undated, unnamed, outside }: records left out because the date was
   *                                     unreadable, the name empty, or the date outside startDate..endDate
   *     records                         the records given
   *   }
   * Rules. Session load of an athlete-day: sum of duration x intensity over the day's records in which both are
   * numeric (0 and 0 is a reported rest day); otherwise missing, never zero. Hooper items: the last record of the
   * day with all four items. Unavailable: the log covers the day, or a record of the day carries an availability
   * answer that availabilityReason recognises.
   * Throws an Error when no record has a readable date and no startDate is given, or when the days span more
   * than about ten years.
   */
  function analyse(records, options) {
    const o = options || {};
    const recs = records || [];
    const budget = resolveBudget(o.budget);
    const log = resolveAvailability(o.availability);

    const names = new Set();
    let first = null, last = null;
    for (const r of recs) {
      if (r.athlete) names.add(r.athlete);
      if (r.date === null) continue;
      if (first === null || r.date < first) first = r.date;
      if (last === null || r.date > last) last = r.date;
    }
    (o.roster || []).forEach(function (n) { const s = strip(n); if (s) names.add(s); });
    const athletes = Array.from(names).sort(compareText);
    const index = new Map(athletes.map(function (n, i) { return [n, i]; }));

    const startDate = o.startDate ? requireDate(o.startDate, 'start date') : first;
    if (startDate === null) {
      throw new Error('No report with a readable date was found. Check that the timestamp column holds dates.');
    }
    const endDate = o.endDate ? requireDate(o.endDate, 'end date')
      : (last !== null && last > startDate ? last : startDate);
    if (endDate < startDate) {
      throw new RangeError('The end date (' + endDate + ') is before the first day of the data (' + startDate + ').');
    }
    const day0 = isoToDayNumber(startDate);
    const T = isoToDayNumber(endDate) - day0 + 1;
    if (T > MAX_DAYS) {
      throw new Error('The dates run from ' + startDate + ' to ' + endDate + ', which is more than ten years. ' +
        'Check the timestamp column for a mistyped date.');
    }
    const N = athletes.length;
    const dates = dateRange(startDate, endDate);

    function grid(value) {
      const g = new Array(T);
      for (let t = 0; t < T; t++) g[t] = new Array(N).fill(value);
      return g;
    }
    const load = grid(null), hooper = grid(null), unavailable = grid(false), reason = grid(null);
    const items = grid(null), recordCount = grid(0);
    const skipped = { undated: 0, unnamed: 0, outside: 0 };

    for (const r of recs) {
      if (r.date === null) { skipped.undated += 1; continue; }
      if (!r.athlete) { skipped.unnamed += 1; continue; }
      const t = isoToDayNumber(r.date) - day0;
      if (t < 0 || t >= T) { skipped.outside += 1; continue; }
      const i = index.get(r.athlete);
      recordCount[t][i] += 1;
      if (r.sessionLoad !== null) load[t][i] = load[t][i] === null ? r.sessionLoad : load[t][i] + r.sessionLoad;
      const complete = r.fatigue !== null && r.stress !== null && r.soreness !== null && r.sleep !== null;
      // order of the items as in File S1 (Table S2): sleep, stress, fatigue, soreness
      if (complete) hooper[t][i] = [r.sleep, r.stress, r.fatigue, r.soreness];
      if (complete) {
        items[t][i] = { fatigue: r.fatigue, stress: r.stress, soreness: r.soreness, sleep: r.sleep };
      } else if (hooper[t][i] === null &&
          (r.fatigue !== null || r.stress !== null || r.soreness !== null || r.sleep !== null)) {
        // no complete answer so far today: keep the latest value given for each item
        const it = items[t][i] || { fatigue: null, stress: null, soreness: null, sleep: null };
        for (const k of ['fatigue', 'stress', 'soreness', 'sleep']) if (r[k] !== null) it[k] = r[k];
        items[t][i] = it;
      }
      const why = availabilityReason(r.availability);
      if (why !== null) { unavailable[t][i] = true; reason[t][i] = why; }
    }
    for (const p of log) {
      const i = index.get(p.athlete);
      if (i === undefined) continue;
      const a = Math.max(0, isoToDayNumber(p.from) - day0);
      const b = p.to === null ? T - 1 : Math.min(T - 1, isoToDayNumber(p.to) - day0);
      for (let t = a; t <= b; t++) { unavailable[t][i] = true; reason[t][i] = p.reason; }
    }

    const squad = HBODEngine.createSquad(athletes);
    const days = new Array(T), lists = new Array(T);
    for (let t = 0; t < T; t++) {
      days[t] = squad.step({ load: load[t], hooper: hooper[t], unavailable: unavailable[t] });
      lists[t] = HBODEngine.alertBudget(days[t].athletes, { enabled: budget.enabled, budget: budget.share });
    }

    const analysis = {
      engineVersion: HBODEngine.VERSION,
      settings: HBODEngine.SETTINGS,
      budget: budget,
      athletes: athletes,
      dates: dates,
      startDate: startDate,
      endDate: endDate,
      days: days,
      lists: lists,
      inputs: { load: load, hooper: hooper, unavailable: unavailable, unavailableReason: reason, items: items,
        recordCount: recordCount },
      availability: log,
      skipped: skipped,
      records: recs
    };
    indexRecords(analysis);
    return analysis;
  }

  // Load series used by the engine for each athlete (reported, squad median or zero), indexed [i][t].
  const usedLoadCache = new WeakMap();
  function usedLoads(analysis) {
    let u = usedLoadCache.get(analysis);
    if (!u) {
      u = analysis.athletes.map(function (_, i) {
        return analysis.days.map(function (d) { return d.athletes[i].load; });
      });
      usedLoadCache.set(analysis, u);
    }
    return u;
  }

  // Dated records of each athlete of an analysis, in the order of the file. The index is built when the analysis
  // is made, so that an analysis keeps describing the records it was given.
  const athleteRecordCache = new WeakMap();
  function indexRecords(analysis) {
    const m = new Map();
    for (const r of analysis.records) {
      if (r.date === null) continue;
      if (!m.has(r.athlete)) m.set(r.athlete, []);
      m.get(r.athlete).push(r);
    }
    athleteRecordCache.set(analysis, m);
    return m;
  }
  function athleteRecords(analysis, athlete) {
    return (athleteRecordCache.get(analysis) || indexRecords(analysis)).get(athlete) || [];
  }

  // ------------------------------------------------------------------ planning indices (planning only)
  /**
   * planningIndices(loads, t) -> { acute, chronic, ratio }
   * Acute load, chronic load and their ratio on day t of one athlete's daily load series (AU), as File S1 defines
   * its uncoupled rolling average: acute = mean of the last 7 days (from t = 6), chronic = mean of the 28 days
   * before those 7 (days t-34 to t-7, from t = 34), ratio = acute / chronic when chronic is above zero. Values
   * that cannot be computed are null. They are shown for planning only and no threshold is attached to them.
   */
  function planningIndices(loads, t) {
    const sum = HBODEngine._internal.pairwiseSum;      // the summation order of File S1
    const acute = t >= 6 ? sum(loads, t - 6, 7) / 7.0 : null;
    const chronic = t >= 34 ? sum(loads, t - 34, 28) / 28.0 : null;
    return { acute: acute, chronic: chronic, ratio: chronic !== null && chronic > 0 ? acute / chronic : null };
  }

  // ------------------------------------------------------------------ health module (unchanged)
  /**
   * healthStatus(records, athlete, date) -> { pain, location, severity, substantial, cannot, flagged }
   * Health signal of one athlete on one day, as in the rule-based prototype.
   *   pain         true when a record of that day answers yes to the daily health item
   *   location     location given with that answer, or null
   *   severity     sum of the four item scores of the most recent Oslo questionnaire of the last seven days
   *                (date-7 to date), or null when there is none
   *   substantial  any of the first three items (participation, volume, performance) at 17 or more
   *   cannot       any of the first three items at 25 or more
   *   flagged      pain, or substantial, or severity above zero
   */
  function healthStatus(records, athlete, date) {
    return healthOf(records.filter(function (r) { return r.athlete === athlete && r.date !== null; }), date);
  }

  // The same for the dated records of one athlete, given in the order of the file.
  function healthOf(mine, date) {
    const today = mine.filter(function (r) { return r.date === date; });
    const pain = today.some(function (r) { return r.pain === true; });
    let location = null;
    for (const r of today) if (r.pain === true && r.painLocation) { location = r.painLocation; break; }
    const from = addDays(date, -7);
    let latest = null;
    for (const r of mine) {
      if (r.date < from || r.date > date || !r.ostrc.some(function (q) { return q !== null; })) continue;
      if (latest === null || r.date >= latest.date) latest = r;       // most recent day, last record of that day
    }
    let severity = null, substantial = false, cannot = false;
    if (latest !== null) {
      const qs = latest.ostrc.map(function (q) { return q || 0; });
      severity = roundHalfEven(((qs[0] + qs[1]) + qs[2]) + qs[3]);
      substantial = qs[0] >= 17 || qs[1] >= 17 || qs[2] >= 17;
      cannot = qs[0] >= 25 || qs[1] >= 25 || qs[2] >= 25;
    }
    return { pain: pain, location: location, severity: severity, substantial: substantial, cannot: cannot,
      flagged: !!(pain || substantial || (severity || 0) > 0) };
  }

  /**
   * applyHealthGate(status) -> { ...status, action, text, reason }
   * The three tiers of the health gate, as in the rule-based prototype. It sits above load and wellness and does
   * not depend on the probability or on the alert rate.
   *   action  'STOP' (could not participate) | 'REFER' (substantial problem) | 'HOLD' (any flag) | null
   *   text    HEALTH_TEXT[action], or null
   *   reason  the prototype's one-line reason with location and severity, or null
   */
  function applyHealthGate(status) {
    const loc = status.location ? ' (' + status.location + ')' : '';
    const sev = status.severity !== null ? ', OSTRC severity ' + String(Math.trunc(status.severity)) : '';
    let action = null, reason = null;
    if (status.cannot) {
      action = 'STOP';
      reason = 'could not participate' + loc + sev + ': STOP, do not train, urgent medical assessment';
    } else if (status.substantial) {
      action = 'REFER';
      reason = 'substantial health problem' + loc + sev + ': reduce load and refer to medical staff';
    } else if (status.flagged) {
      action = 'HOLD';
      reason = 'health flag today' + loc + ': hold, do not increase, monitor';
    }
    return { pain: status.pain, location: status.location, severity: status.severity, substantial: status.substantial,
      cannot: status.cannot, flagged: status.flagged, action: action, text: action ? HEALTH_TEXT[action] : null,
      reason: reason };
  }

  // ------------------------------------------------------------------ formatting helpers
  /**
   * formatLoad(au, placeholder?) -> string
   * A load in AU without the unit, with one decimal only when needed: '420' or '412.5'. null gives the
   * placeholder (default 'n/a').
   */
  function formatLoad(au, placeholder) {
    const missing = au === null || au === undefined || Number.isNaN(au);
    if (missing) return placeholder === undefined ? 'n/a' : placeholder;
    const s = (Number(au) + 0).toFixed(1);
    return s.endsWith('.0') ? s.slice(0, -2) : s;
  }

  /**
   * formatRatio(ratio, placeholder?) -> string
   * The ratio of acute to chronic load with two decimals: '1.08'. null gives the placeholder (default 'n/a').
   */
  function formatRatio(ratio, placeholder) {
    const missing = ratio === null || ratio === undefined || Number.isNaN(ratio);
    if (missing) return placeholder === undefined ? 'n/a' : placeholder;
    return Number(ratio).toFixed(2);
  }

  // ------------------------------------------------------------------ daily report data
  function tIndex(analysis, date) {
    if (!analysis.dates.length) throw new RangeError('The analysis holds no day.');
    const d = date === null || date === undefined || date === '' ? analysis.endDate : requireDate(date, 'report date');
    const t = isoToDayNumber(d) - isoToDayNumber(analysis.startDate);
    if (t < 0 || t >= analysis.dates.length) {
      throw new RangeError('The date ' + d + ' is outside the data (' + analysis.startDate + ' to ' +
        analysis.endDate + ').');
    }
    return t;
  }

  function statusOf(a, list) {
    if (a.unavailable) return 'unavailable';
    if (a.probability === null) return 'baseline-building';
    if (list.listed.indexOf(a.id) >= 0) return 'listed';
    if (list.overflow.indexOf(a.id) >= 0) return 'above-outside-budget';
    return 'below-threshold';
  }

  // Deterministic sentences about one athlete-day. No model is involved.
  function buildNotes(a, day, settings) {
    const notes = [];
    if (a.unavailable) {
      notes.push(a.unavailableReason && a.unavailableReason !== 'unavailable'
        ? 'Unavailable (' + a.unavailableReason + '): zero load.' : 'Unavailable: zero load.');
    } else if (a.imputed) {
      notes.push(day.reporters > 0
        ? 'No session load reported today: the squad median (' + formatLoad(day.squadMedian) + ' AU) was used and ' +
          'the uncertainty of fitness and fatigue was multiplied by four.'
        : 'No session load reported today by any available athlete: a load of 0 AU was used and the uncertainty ' +
          'of fitness and fatigue was multiplied by four.');
      if (a.recordsToday > 0) {
        notes.push('A form was received today, but it holds no usable session duration and intensity.');
      }
    }
    if (a.corrected) notes.push('Wellness correction applied (all four Hooper items).');
    else if (a.hooperMean !== null) {
      notes.push('No wellness correction today (the correction starts after ' + settings.correctionStartDay +
        ' days of data).');
    } else notes.push('No wellness correction today (Hooper items incomplete).');
    if (a.probability === null) {
      notes.push('No probability yet: the personal baseline needs ' + settings.baselineStartDay +
        ' previous days of data (' + day.t + ' so far).');
    }
    if (a.status === 'listed' || a.status === 'above-outside-budget') {
      notes.push(a.driver === 'wellness strain'
        ? 'Mainly driven by wellness strain: check symptoms, since a wellness-driven alert can be an early sign ' +
          'of illness.'
        : 'Mainly driven by the load deficit (modelled fatigue minus modelled fitness).');
    }
    return notes;
  }

  /**
   * dayReport(analysis, date?) -> dayReport
   * Everything the application, the report and the language-model layer show for one day (default: the last day).
   * Throws a RangeError when the date is outside the analysis.
   *   dayReport = {
   *     date, t (day index from 0), dayNumber (t + 1), startDate, engineVersion, settings,
   *     squadMedian         median reported load of the available athletes today, AU (0 when none reported)
   *     reporters           number of available athletes who reported a session load today
   *     budget    { enabled, share, healthy, cap, listed: [names], overflow: [names], ranking: [names] }
   *               listed = today's list; overflow = at or above the threshold but outside today's alert rate;
   *               ranking = every healthy athlete with a probability, highest first
   *     counts    { athletes, healthy, unavailable, reported, missing, listed, aboveOutsideBudget, belowThreshold,
   *                 baselineBuilding, healthGate }
   *               reported and missing count healthy athletes with and without a session load today
   *     athletes  [ {
   *       name
   *       rank                1 = highest probability among healthy athletes with a probability; null otherwise
   *       status              'listed' | 'above-outside-budget' | 'below-threshold' | 'baseline-building' |
   *                           'unavailable' (labels in STATUS_LABELS)
   *       probability         number | null   posterior probability of the engine; null before day 28
   *       logit               number | null
   *       alert               true when the probability reached 0.80
   *       pDeficit, pStrain   number | null   the two parts of the probability
   *       driver              'wellness strain' | 'load deficit' | null   the larger part (wellness strain on a tie)
   *       reported            a session load was reported today
   *       imputed             the squad median was used (healthy athlete without a reported load)
   *       unavailable, unavailableReason | null
   *       load                AU used by the engine: reported load, squad median or zero
   *       reportedLoad        number | null   AU as reported
   *       recordsToday        number of form records of the athlete today
   *       hooper              { fatigue, stress, soreness, sleep } | null   today's items, any may be null
   *       hooperMean          number | null   mean of the four items when all were given
   *       corrected           the wellness correction was applied today
   *       fitness, fatigue, deficit   modelled states in kAU (deficit = fatigue - fitness)
   *       strain              wellness strain in Hooper item units
   *       sdDeficit, sdStrain posterior standard deviations
   *       baseline            { days, meanDeficit, sdDeficit, meanStrain, sdStrain } | null
   *       planning            { acute, chronic, ratio }   AU, AU and a ratio, null when not yet available;
   *                           planning only
   *       health              { pain, location, severity, substantial, cannot, flagged,
   *                             action: 'STOP' | 'REFER' | 'HOLD' | null, text, reason }
   *       daysReported28      days with a reported session load among the last 28 (today included)
   *       notes               string[]   plain sentences about today's computation
   *     } ]
   *   }
   * Order of athletes: health gate first (STOP, REFER, HOLD, by name within each), then today's list by
   * probability, then above the threshold but outside the budget, then below the threshold by probability, then
   * baseline building and unavailable athletes by name.
   */
  function dayReport(analysis, date) {
    const t = tIndex(analysis, date);
    const day = analysis.days[t], list = analysis.lists[t];
    const S = analysis.settings;
    const used = usedLoads(analysis);
    const rankOf = new Map(list.ranking.map(function (n, k) { return [n, k + 1]; }));
    const today = analysis.dates[t];

    const rows = analysis.athletes.map(function (name, i) {
      const e = day.athletes[i];
      let reported28 = 0;
      for (let k = Math.max(0, t - 27); k <= t; k++) if (analysis.inputs.load[k][i] !== null) reported28 += 1;
      const a = {
        name: name,
        rank: rankOf.has(name) ? rankOf.get(name) : null,
        status: statusOf(e, list),
        probability: e.probability,
        logit: e.logit,
        alert: e.alert,
        pDeficit: e.pDeficit,
        pStrain: e.pStrain,
        driver: e.probability === null ? null : (e.pStrain >= e.pDeficit ? 'wellness strain' : 'load deficit'),
        reported: e.reported,
        imputed: e.imputed,
        unavailable: e.unavailable,
        unavailableReason: e.unavailable ? analysis.inputs.unavailableReason[t][i] : null,
        load: e.load,
        reportedLoad: analysis.inputs.load[t][i],
        recordsToday: analysis.inputs.recordCount[t][i],
        hooper: analysis.inputs.items[t][i],
        hooperMean: e.hooperMean,
        corrected: e.corrected,
        fitness: e.fitness,
        fatigue: e.fatigue,
        strain: e.strain,
        deficit: e.deficit,
        sdDeficit: e.sdDeficit,
        sdStrain: e.sdStrain,
        baseline: e.baseline,
        planning: planningIndices(used[i], t),
        health: applyHealthGate(healthOf(athleteRecords(analysis, name), today)),
        daysReported28: reported28,
        notes: null
      };
      a.notes = buildNotes(a, day, S);
      return a;
    });

    // display order; the planning indices take no part in it
    function gate(a) { const k = HEALTH_ACTIONS.indexOf(a.health.action); return k < 0 ? HEALTH_ACTIONS.length : k; }
    rows.sort(function (p, q) {
      const g = gate(p) - gate(q);
      if (g !== 0) return g;
      if (p.health.action !== null) return compareText(p.name, q.name);
      const s = STATUS_ORDER.indexOf(p.status) - STATUS_ORDER.indexOf(q.status);
      if (s !== 0) return s;
      if (p.rank !== null && q.rank !== null && p.rank !== q.rank) return p.rank - q.rank;
      return compareText(p.name, q.name);
    });

    const count = function (f) { return rows.filter(f).length; };
    return {
      date: today,
      t: t,
      dayNumber: t + 1,
      startDate: analysis.startDate,
      engineVersion: analysis.engineVersion,
      settings: S,
      squadMedian: day.squadMedian,
      reporters: day.reporters,
      budget: { enabled: list.enabled, share: list.budget, healthy: list.healthy, cap: list.cap,
        listed: list.listed.slice(), overflow: list.overflow.slice(), ranking: list.ranking.slice() },
      counts: {
        athletes: rows.length,
        healthy: count(function (a) { return !a.unavailable; }),
        unavailable: count(function (a) { return a.unavailable; }),
        reported: count(function (a) { return !a.unavailable && a.reported; }),
        missing: count(function (a) { return a.imputed; }),
        listed: count(function (a) { return a.status === 'listed'; }),
        aboveOutsideBudget: count(function (a) { return a.status === 'above-outside-budget'; }),
        belowThreshold: count(function (a) { return a.status === 'below-threshold'; }),
        baselineBuilding: count(function (a) { return a.status === 'baseline-building'; }),
        healthGate: count(function (a) { return a.health.action !== null; })
      },
      athletes: rows
    };
  }

  /**
   * series(analysis, name) -> one athlete's values on every day of the analysis (arrays aligned with dates)
   *   {
   *     name, dates
   *     load                AU used by the engine (reported, squad median or zero)
   *     reportedLoad        number | null   AU as reported
   *     reported, imputed, unavailable      booleans
   *     probability, pDeficit, pStrain      number | null (null before day 28)
   *     alert               probability reached 0.80
   *     status              status of the day, as in dayReport
   *     listed              true on the days the athlete was on the daily list
   *     fitness, fatigue, deficit           kAU
   *     strain              Hooper item units
   *     acute, chronic, ratio               planning only; null until available
   *     hooperMean          number | null
   *     items               { fatigue: [], stress: [], soreness: [], sleep: [] }   daily Hooper items, null when
   *                         not given
   *     squadMedian         AU, the same for every athlete of the squad
   *   }
   * Throws a RangeError when the athlete is not in the analysis.
   */
  function series(analysis, name) {
    const i = analysis.athletes.indexOf(name);
    if (i < 0) throw new RangeError('Unknown athlete: ' + String(name));
    const loads = usedLoads(analysis)[i];
    const pick = function (key) { return analysis.days.map(function (d) { return d.athletes[i][key]; }); };
    const plan = analysis.dates.map(function (_, t) { return planningIndices(loads, t); });
    const item = function (key) {
      return analysis.inputs.items.map(function (row) { return row[i] === null ? null : row[i][key]; });
    };
    const status = analysis.days.map(function (d, t) { return statusOf(d.athletes[i], analysis.lists[t]); });
    return {
      name: name,
      dates: analysis.dates.slice(),
      load: loads.slice(),
      reportedLoad: analysis.inputs.load.map(function (row) { return row[i]; }),
      reported: pick('reported'),
      imputed: pick('imputed'),
      unavailable: pick('unavailable'),
      probability: pick('probability'),
      pDeficit: pick('pDeficit'),
      pStrain: pick('pStrain'),
      alert: pick('alert'),
      status: status,
      listed: status.map(function (s) { return s === 'listed'; }),
      fitness: pick('fitness'),
      fatigue: pick('fatigue'),
      strain: pick('strain'),
      deficit: pick('deficit'),
      acute: plan.map(function (p) { return p.acute; }),
      chronic: plan.map(function (p) { return p.chronic; }),
      ratio: plan.map(function (p) { return p.ratio; }),
      hooperMean: pick('hooperMean'),
      items: { fatigue: item('fatigue'), stress: item('stress'), soreness: item('soreness'), sleep: item('sleep') },
      squadMedian: analysis.days.map(function (d) { return d.squadMedian; })
    };
  }

  // ------------------------------------------------------------------ audit log
  const AUDIT_COLUMNS = Object.freeze(['generated_at', 'data_through', 'day_number', 'athlete', 'status', 'probability',
    'alert', 'on_list', 'rank', 'p_deficit', 'p_strain', 'driver', 'report', 'load_used', 'squad_median',
    'unavailable', 'health_action', 'acute_load', 'chronic_load', 'ratio', 'budget_enabled', 'budget_share',
    'budget_cap', 'engine_version']);

  /**
   * auditRows(dayReport, generatedAtISO) -> object[]
   * One row per athlete, in the display order of the day report, with the columns of AUDIT_COLUMNS:
   *   generated_at (the timestamp given), data_through (date), day_number, athlete, status,
   *   probability (full precision, null before day 28), alert, on_list, rank, p_deficit, p_strain, driver,
   *   report ('reported' | 'missing': whether a session load was reported today), load_used (AU), squad_median (AU),
   *   unavailable, health_action, acute_load, chronic_load, ratio (the last three for planning only),
   *   budget_enabled, budget_share, budget_cap, engine_version.
   * toCSV(rows, AUDIT_COLUMNS) writes them as CSV.
   */
  function auditRows(day, generatedAtISO) {
    return day.athletes.map(function (a) {
      return {
        generated_at: generatedAtISO === undefined || generatedAtISO === null ? '' : String(generatedAtISO),
        data_through: day.date,
        day_number: day.dayNumber,
        athlete: a.name,
        status: a.status,
        probability: a.probability,
        alert: a.alert,
        on_list: a.status === 'listed',
        rank: a.rank,
        p_deficit: a.pDeficit,
        p_strain: a.pStrain,
        driver: a.driver,
        report: a.reported ? 'reported' : 'missing',
        load_used: a.load,
        squad_median: day.squadMedian,
        unavailable: a.unavailable,
        health_action: a.health.action,
        acute_load: a.planning.acute,
        chronic_load: a.planning.chronic,
        ratio: a.planning.ratio,
        budget_enabled: day.budget.enabled,
        budget_share: day.budget.share,
        budget_cap: day.budget.cap,
        engine_version: day.engineVersion
      };
    });
  }

  return {
    WORDING: WORDING,
    HEALTH_TEXT: HEALTH_TEXT,
    STATUS_ORDER: STATUS_ORDER,
    STATUS_LABELS: STATUS_LABELS,
    COLMAP: COLMAP,
    REQUIRED_COLUMNS: REQUIRED_COLUMNS,
    OSTRC_LABELS: OSTRC_LABELS,
    DATE_FORMATS: DATE_FORMATS,
    AUDIT_COLUMNS: AUDIT_COLUMNS,
    decodeText: decodeText,
    parseCSV: parseCSV,
    toCSV: toCSV,
    matchColumns: matchColumns,
    toRecords: toRecords,
    analyse: analyse,
    dayReport: dayReport,
    series: series,
    auditRows: auditRows,
    healthStatus: healthStatus,
    applyHealthGate: applyHealthGate,
    planningIndices: planningIndices,
    availabilityReason: availabilityReason,
    toFloat: toFloat,
    yesNo: yesNo,
    ostrcScore: ostrcScore,
    parseDate: parseDate,
    addDays: addDays,
    dayDiff: dayDiff,
    dateRange: dateRange,
    weekday: weekday,
    formatLoad: formatLoad,
    formatRatio: formatRatio,
    compareText: compareText
  };
});
</script>
<script data-source="app/src/report.js">
/*
 * HBOD daily report and periodic reviews (JavaScript).
 *
 * Turns the day report of the analytical core (core.js) into the report that the staff read: one self-contained
 * HTML page and the same content as plain text. Nothing is computed or decided here. The probability, the list and
 * the health gate are printed as the core gives them.
 *
 * The health gate comes first, then today's list, then the athletes above the threshold but outside today's alert
 * budget, the table of all athletes, the missing reports to follow up the same day and the unavailable athletes.
 * Acute load, chronic load and their ratio are printed under a "planning only" heading; no colour, label, order or
 * sentence of the report depends on them.
 *
 * The periodic reviews (weekly, monthly, quarterly) are descriptive tables. They hold no suggestion and no decision.
 *
 * Every value that comes from the responses file or from the staff (names, locations, reasons, timestamps) is
 * escaped before it is written into HTML. The page loads nothing from the network.
 *
 * Pure computation: no DOM, no network, no storage, no clock. Runs unchanged in the browser and in Node.js.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(require('./core.js'));
  else root.HBODReport = factory(root.HBODCore);
})(typeof globalThis !== 'undefined' ? globalThis : this, function (HBODCore) {
  'use strict';

  const W = HBODCore.WORDING;

  // Section titles, shared by the HTML page and the plain text.
  const TITLES = Object.freeze({
    gate: 'Health gate',
    list: "Today's list",
    overflow: "Above the threshold but outside today's alert rate",
    all: 'All athletes',
    missing: 'Missing reports',
    unavailable: 'Unavailable athletes'
  });

  // Periodic reviews: tag, number of days and title.
  const REVIEWS = Object.freeze([
    Object.freeze({ tag: 'weekly', days: 7, title: 'Weekly review (last 7 days)' }),
    Object.freeze({ tag: 'monthly', days: 28, title: 'Monthly review (last 28 days)' }),
    Object.freeze({ tag: 'quarterly', days: 90, title: 'Quarterly review (last 90 days)' })
  ]);

  const REVIEW_NOTE = 'Descriptive review: it holds no suggestion and no decision. Load is the load used by HBOD ' +
    '(the reported load, the squad median on a day without a report, zero on an unavailable day). The trend ' +
    'compares the later half of the period with the earlier half: up when it is more than 10% higher, down when ' +
    'it is more than 10% lower, otherwise stable. Sleep and fatigue are Hooper items from 1 (best) to 7 (worst).';

  const FOLLOW_UP = 'Contact these athletes today. A missing report is not a sign of recovery.';
  const NO_GATE = 'No athlete is held, referred or stopped by the health gate today.';
  const LIST_FULL = 'These athletes reached the alert threshold, but the daily list is full.';
  const ALL_REPORTED = 'Every healthy athlete reported a session load today.';
  const UNAVAILABLE_NOTE = 'Injured, ill or in return to play: these athletes contribute zero load and are never ' +
    'on the list.';
  const NONE_UNAVAILABLE = 'No athlete is recorded as injured, ill or in return to play today.';
  const EMPTY_FORM = 'a form was received, but it holds no usable session duration and intensity';
  const INCOMPLETE_ITEMS = 'Session load reported, but the four Hooper items are incomplete, so there is no ' +
    'wellness correction today: ';

  // ------------------------------------------------------------------ escaping
  const HTML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

  /** escapeHTML(value) -> string. Text made safe for HTML content and for quoted attribute values. */
  function escapeHTML(value) {
    const s = value === null || value === undefined ? '' : String(value);
    return s.replace(/[&<>"']/g, function (c) { return HTML_ESCAPES[c]; });
  }

  // Markup that is already safe. Everything else that enters an element below is escaped.
